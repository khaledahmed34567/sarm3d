<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>سرمد</title>
<meta name="description" content="منصة كورسات في هندسة البرمجيات والأمن السيبراني" />
<meta name="theme-color" content="#FFFFFF" />

<!-- PWA manifest inlined as a data URI so the app stays to 3 physical files -->
<link rel="manifest" id="manifest-link" />

<!-- App icon inlined as an SVG data URI (used for apple-touch-icon too) -->
<link rel="icon" id="favicon-link" />
<link rel="apple-touch-icon" id="apple-icon-link" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="سرمد" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="nav-bar" class="nav-bar hidden">
  <button id="nav-home" class="nav-icon" aria-label="الرئيسية">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-4.5h3V19a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-9"/>
    </svg>
  </button>

  <div id="app-logo" class="nav-logo inline-logo-slot" aria-label="سرمد"></div>

  <button id="nav-dashboard" class="nav-icon" aria-label="لوحة التحكم">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16.5" y="3.5" width="4" height="16.5" rx="1"/>
    </svg>
  </button>

  <button id="contact-btn" class="nav-icon" aria-label="تواصل معنا">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 6.5L20.5 6"/>
    </svg>
  </button>

  <button id="nav-logout" class="nav-icon" aria-label="تسجيل الخروج">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15.5 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h8.5"/><path d="M10.5 12h10m0 0-3-3m3 3-3 3"/>
    </svg>
  </button>
</nav>

<button id="install-btn" class="install-fab hidden" aria-label="تثبيت التطبيق">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v11m0 0-4-4m4 4 4-4"/><path d="M4.5 16v3a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"/>
  </svg>
  <span>تثبيت التطبيق</span>
</button>

<main id="app"></main>

<script type="module" src="app.js"></script>
</body>
</html>
