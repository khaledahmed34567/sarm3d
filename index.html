<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رقيم | Raqeem</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="https://i.ibb.co/3mG5jPZT/icon.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/3mG5jPZT/icon.png">

<style>
/* ============ FONTS ============ */
@font-face{font-family:'AppTitles';src:url('https://files.catbox.moe/fwgw08.otf') format('opentype');font-weight:700;font-display:swap;}
@font-face{font-family:'AppBody';src:url('https://files.catbox.moe/jernkn.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'AppArticles';src:url('https://files.catbox.moe/mmhk4x.otf') format('opentype');font-weight:400;font-display:swap;}
@font-face{font-family:'AppSub';src:url('https://files.catbox.moe/gsv6s7.otf') format('opentype');font-weight:400;font-display:swap;}

/* ============ TOKENS — clean white Apple palette, light only ============ */
:root{
  --canvas:#FFFFFF;
  --surface:#FFFFFF;
  --surface-2:#F7F6F3;
  --surface-glass:rgba(255,255,255,.78);
  --ink:#151510;
  --ink-soft:#6B6A60;
  --line:#EBE8E0;
  --emerald:#0E6B56;
  --emerald-soft:#0E6B5612;
  --gold:#C6A87D;
  --gold-soft:#C6A87D1c;
  --danger:#B23A34;
  --radius-lg:24px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow-soft:0 1px 2px rgba(21,20,15,.03), 0 10px 26px -12px rgba(21,20,15,.10);
  --shadow-lift:0 4px 8px rgba(21,20,15,.05), 0 22px 44px -16px rgba(21,20,15,.18);
  color-scheme:light;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{overflow-x:hidden; scrollbar-gutter:stable;}
html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink); max-width:100%;}
body{overflow-x:hidden; font-family:'AppBody','SF Pro Arabic','Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; min-height:100dvh; transition:background .3s ease,color .3s ease;}
/* consistent slim brand-tinted scrollbar everywhere (page + any inner scroll areas) */
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:100px; border:2px solid var(--canvas);}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}
*{scrollbar-width:thin; scrollbar-color:var(--line) transparent;}
h1,h2,h3,.title{font-family:'AppTitles','AppBody',sans-serif; font-weight:700; margin:0; letter-spacing:-.01em;}
.articles{font-family:'AppArticles','AppBody',serif; line-height:1.9;}
.eyebrow,.caption,label,.sub{font-family:'AppSub','AppBody',sans-serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit;}
img{max-width:100%; display:block;}
::selection{background:var(--gold-soft); color:var(--ink);}
:focus-visible{outline:2px solid var(--emerald); outline-offset:3px; border-radius:8px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important; transition-duration:.001ms !important;}}
.icon{width:18px; height:18px; display:inline-block; flex-shrink:0;}
.icon svg{width:100%; height:100%;}

.wrap{max-width:1180px; margin:0 auto; padding:0 clamp(16px,4vw,24px);}

/* ---- Nav (cleaned) ---- */
.nav{position:sticky; top:0; z-index:40; backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); background:var(--surface-glass); border-bottom:1px solid var(--line);}
.nav-inner{display:flex; align-items:center; justify-content:space-between; height:60px;}
.brand{display:flex; align-items:center; cursor:pointer; transition:opacity .15s;}
.brand:active{opacity:.6;}
.brand .logo-mark{width:32px; height:32px; border-radius:9px; overflow:hidden; display:flex; align-items:center; justify-content:center;}
.brand .logo-mark img{width:100%; height:100%; object-fit:cover; filter:brightness(0) saturate(100%);}
.nav-links{display:flex; align-items:center; gap:26px; font-size:14px; color:var(--ink-soft);}
.nav-links a{padding:4px 0; transition:color .15s;}
.nav-links a:hover{color:var(--ink);}
.nav-actions{display:flex; align-items:center; gap:8px;}
.icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); transition:background .15s,color .15s;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
@media(max-width:760px){.nav-links{display:none;}}

/* ---- Buttons ---- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px; padding:0 20px; border-radius:100px; border:1px solid transparent; font-size:15px; font-weight:590; letter-spacing:-.01em; cursor:pointer; transition:transform .12s ease, opacity .15s ease, background .15s ease; white-space:nowrap;}
.btn:active{transform:scale(.95); opacity:.85;}
.btn-primary{background:var(--emerald); color:#fff;}
.btn-primary:hover{opacity:.92;}
.btn-ghost{background:var(--surface-2); color:var(--ink); border-color:transparent;}
.btn-ghost:hover{background:var(--line);}
.btn-gold{background:var(--gold); color:#241d10;}
.btn-block{width:100%;}
.btn-sm{min-height:36px; padding:0 15px; font-size:13.5px;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

.switch{position:relative; width:46px; height:28px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0; position:absolute;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:100px; transition:background .2s;}
.switch .thumb{position:absolute; top:2px; right:2px; width:24px; height:24px; background:#fff; border-radius:50%; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s;}
.switch input:checked + .track{background:var(--emerald);}
.switch input:checked + .track .thumb{transform:translateX(18px);}

/* ---- Hero ---- */
.hero{padding:88px 0 64px; position:relative;}
.hero-eyebrow{color:var(--gold); font-size:13px; letter-spacing:.06em; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
.hero-eyebrow::before{content:''; width:22px; height:1px; background:var(--gold);}
.hero h1{font-size:clamp(32px,5.2vw,54px); line-height:1.2; max-width:760px;}
.hero h1 em{font-style:normal; color:var(--emerald);}
.hero p{color:var(--ink-soft); font-size:16.5px; max-width:520px; margin-top:18px; line-height:1.8;}
.hero-cta{display:flex; gap:12px; margin-top:30px; flex-wrap:wrap;}

.isnad{display:flex; align-items:center; gap:0; margin-top:52px; overflow-x:auto; padding-bottom:4px;}
.isnad .node{display:flex; flex-direction:column; align-items:center; gap:8px; min-width:90px; flex-shrink:0;}
.isnad .dot{width:10px; height:10px; border-radius:50%; background:var(--line); border:2px solid var(--surface);}
.isnad .node.done .dot{background:var(--emerald);}
.isnad .node.active .dot{background:var(--gold); box-shadow:0 0 0 5px var(--gold-soft);}
.isnad .thread{height:1.5px; background:var(--line); flex:1; min-width:24px;}
.isnad .node .lbl{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

.section{padding:52px 0;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; gap:16px;}
.section-head h2{font-size:24px;}
.section-head .see-all{font-size:13.5px; color:var(--emerald); flex-shrink:0; display:flex; align-items:center; gap:4px;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:18px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-soft); transition:transform .25s ease, box-shadow .25s ease; cursor:pointer;}
.card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lift);}
.card .thumb{aspect-ratio:16/10; background:var(--surface-2); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
.card .thumb img{width:100%; height:100%; object-fit:cover;}
.card .body{padding:16px 18px 20px;}
.card .kicker{font-size:11.5px; color:var(--gold); margin-bottom:6px; font-weight:600;}
.card h3{font-size:16px; line-height:1.4;}
.card .meta{color:var(--ink-soft); font-size:12.5px; margin-top:8px; display:flex; align-items:center; gap:6px;}
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 37%,var(--line) 63%); background-size:400% 100%; animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* ---- Breadcrumb / page head ---- */
.crumb{display:flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px; margin-bottom:18px; flex-wrap:wrap;}
.crumb a:hover{color:var(--emerald);}
.page-head{padding:40px 0 8px;}
.page-head h1{font-size:clamp(26px,3.6vw,38px);}
.page-head p{color:var(--ink-soft); margin-top:10px; max-width:640px; line-height:1.8;}
.share-row{display:flex; gap:8px; margin-top:16px;}

/* ---- Lists (lectures/tasks) ---- */
.list{display:flex; flex-direction:column; gap:10px;}
.list-item{display:flex; align-items:center; gap:14px; padding:16px 18px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface); cursor:pointer; transition:background .15s, border-color .15s;}
.list-item:hover{background:var(--surface-2);}
.list-item.locked{cursor:not-allowed; opacity:.55;}
.list-item .num{width:34px; height:34px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink-soft); font-size:13px;}
.list-item.done .num{background:var(--emerald); color:#fff;}
.list-item .info{flex:1; min-width:0;}
.list-item .info h4{font-size:15px; font-weight:600; margin:0;}
.list-item .info span{font-size:12.5px; color:var(--ink-soft);}
.list-item .status-icon{color:var(--ink-soft); flex-shrink:0;}
.list-item.done .status-icon{color:var(--emerald);}

/* ---- Player ---- */
.player-frame{background:#0b0b09; border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-lift); margin-bottom:24px;}
.player-frame video, .player-frame iframe{width:100%; display:block; aspect-ratio:16/9; border:none;}
.player-frame audio{width:100%; padding:24px;}
.pdf-frame{width:100%; height:76vh; border:none; border-radius:var(--radius-lg); border:1px solid var(--line);}
.task-actions{display:flex; gap:12px; margin-top:22px; align-items:center; flex-wrap:wrap;}

/* ---- Quiz ---- */
.quiz-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding:16px 20px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--surface-2);}
.quiz-timer{font-family:'AppTitles'; font-size:18px; display:flex; align-items:center; gap:8px;}
.quiz-timer.warn{color:var(--danger);}
.q-card{border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; margin-bottom:16px; background:var(--surface);}
.q-card h4{font-size:15.5px; margin-bottom:16px; line-height:1.6;}
.q-opt{display:flex; align-items:center; gap:12px; padding:13px 16px; border:1px solid var(--line); border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s;}
.q-opt:hover{background:var(--surface-2);}
.q-opt.selected{border-color:var(--emerald); background:var(--emerald-soft);}
.q-opt input{accent-color:var(--emerald);}
.quiz-result{text-align:center; padding:48px 20px;}
.quiz-result .score{font-family:'AppTitles'; font-size:56px; color:var(--emerald);}
.quiz-result.fail .score{color:var(--danger);}

/* ---- Payment ---- */
.pay-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:24px 0;}
.pay-opt{border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; text-align:center; cursor:pointer; transition:border-color .15s, transform .15s;}
.pay-opt:hover{transform:translateY(-3px);}
.pay-opt.active{border-color:var(--emerald); background:var(--emerald-soft);}
.pay-opt .icon{width:30px; height:30px; margin:0 auto 12px;}
.pay-detail{border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px; margin-top:20px;}
.copy-row{display:flex; align-items:center; gap:10px; background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 16px; font-family:'AppTitles'; font-size:17px; direction:ltr; justify-content:space-between;}
.plan-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:8px;}
.plan-card{border:1px solid var(--line); border-radius:var(--radius-md); padding:22px; text-align:center;}
.plan-card.featured{border-color:var(--gold); box-shadow:var(--shadow-soft);}
.plan-card .price{font-family:'AppTitles'; font-size:28px; margin:10px 0;}

/* ---- Certificate ---- */
.cert-box{border:2px solid var(--gold); border-radius:var(--radius-lg); padding:40px; text-align:center; background:var(--surface); position:relative;}
.cert-box .valid-badge{display:inline-flex; align-items:center; gap:6px; background:var(--emerald-soft); color:var(--emerald); padding:6px 14px; border-radius:100px; font-size:12.5px; margin-bottom:20px;}
.cert-box h2{font-size:26px; margin-bottom:6px;}
.cert-box .qr{width:150px; height:150px; margin:22px auto 0; border-radius:12px; border:1px solid var(--line);}

/* ---- Dashboard ---- */
.dash-grid{display:grid; grid-template-columns:260px 1fr; gap:28px;}
.dash-nav{display:flex; flex-direction:column; gap:4px;}
.dash-nav button{display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--radius-sm); border:none; background:transparent; text-align:right; cursor:pointer; color:var(--ink-soft); font-size:14px;}
.dash-nav button.active{background:var(--emerald-soft); color:var(--emerald); font-weight:600;}
.progress-bar{height:6px; background:var(--line); border-radius:100px; overflow:hidden; margin-top:10px;}
.progress-bar > div{height:100%; background:var(--emerald); border-radius:100px; transition:width .4s ease;}
@media(max-width:760px){.dash-grid{grid-template-columns:1fr;}}

/* ---- Modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(15,14,10,.45); backdrop-filter:blur(4px); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; pointer-events:none; transition:opacity .22s ease;}
.modal-overlay.open{opacity:1; pointer-events:auto;}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:420px; padding:32px; box-shadow:var(--shadow-lift); border:1px solid var(--line); transform:translateY(14px) scale(.98); transition:transform .25s ease; max-height:88vh; overflow-y:auto;}
.modal-overlay.open .modal{transform:translateY(0) scale(1);}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
.modal-head h2{font-size:20px;}
.modal-close{width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
.field{margin-bottom:16px;}
.field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:7px;}
.field input,.field select{width:100%; padding:12px 14px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--canvas); color:var(--ink); font-size:14.5px; font-family:inherit; transition:border-color .15s;}
.field input:focus,.field select:focus{border-color:var(--emerald); outline:none;}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.seg{display:flex; border:1px solid var(--line); border-radius:100px; padding:3px; gap:3px;}
.seg button{flex:1; padding:9px; border:none; background:transparent; border-radius:100px; font-size:13.5px; cursor:pointer; color:var(--ink-soft); font-family:inherit;}
.seg button.active{background:var(--emerald); color:#fff;}
.remember-row{display:flex; align-items:center; justify-content:space-between; margin:18px 0 22px;}
.remember-row span{font-size:13.5px; color:var(--ink-soft);}
.forgot{font-size:13px; color:var(--emerald); text-align:center; display:block; margin-top:16px; cursor:pointer; background:none; border:none; font-family:inherit;}
.divider{display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--ink-soft); font-size:12.5px;}
.divider::before,.divider::after{content:''; flex:1; height:1px; background:var(--line);}
.tabs{display:flex; gap:24px; margin-bottom:24px; border-bottom:1px solid var(--line);}
.tabs button{background:none; border:none; padding:0 0 12px; font-size:15px; color:var(--ink-soft); cursor:pointer; font-family:inherit; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabs button.active{color:var(--ink); border-color:var(--emerald); font-weight:600;}
.err-msg{color:var(--danger); font-size:12.5px; margin-top:6px; display:none;}
.google-btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:11px; border:1px solid var(--line); border-radius:100px; background:var(--surface); cursor:pointer; font-size:14px; font-weight:500; color:var(--ink);}
.google-btn:hover{background:var(--surface-2);}

.avatar-btn{width:34px; height:34px; border-radius:50%; overflow:hidden; border:1px solid var(--line); background:var(--emerald-soft); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--emerald); font-weight:700;}
.avatar-btn img{width:100%; height:100%; object-fit:cover;}

.footer{border-top:1px solid var(--line); padding:36px 0; margin-top:40px;}
.footer .wrap{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px;}
.footer p{color:var(--ink-soft); font-size:13px;}

.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--canvas); padding:13px 22px; border-radius:100px; font-size:13.5px; z-index:200; opacity:0; pointer-events:none; transition:all .3s ease; box-shadow:var(--shadow-lift); display:flex; align-items:center; gap:8px;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .hero{padding:52px 0 36px;}
  .field-row{flex-direction:column; gap:0;}
  .modal{padding:24px;}
  .dash-grid{grid-template-columns:1fr;}
}
@media(min-width:761px) and (max-width:980px){
  .dash-grid{grid-template-columns:220px 1fr;}
  .nav-links{gap:18px; font-size:13.5px;}
}
@media(min-width:1400px){
  .wrap{max-width:1320px;}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <div class="brand" data-route="" aria-label="رقيم">
      <span class="logo-mark"><img src="https://i.ibb.co/NdFdqsQT/logo.png" alt="رقيم"></span>
    </div>
    <div class="nav-links">
      <a href="#/">الرئيسية</a>
      <a href="#tracks-anchor" data-route="">المسارات</a>
      <a href="#/dashboard">لوحتي</a>
    </div>
    <div class="nav-actions" id="navActions">
      <button class="btn btn-ghost btn-sm" id="loginBtn">تسجيل الدخول</button>
      <button class="btn btn-primary btn-sm" id="signupBtn">إنشاء حساب</button>
    </div>
  </div>
</nav>

<main id="appRoot"></main>

<footer class="footer">
  <div class="wrap">
    <p>رقيم — «توكّل على الله وكفى بالله وكيلًا»</p>
    <p id="footYear"></p>
  </div>
</footer>

<!-- ============ AUTH MODAL ============ -->
<div class="modal-overlay" id="authOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="authTitle">تسجيل الدخول</h2>
      <button class="modal-close" id="authClose">✕</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="login">تسجيل الدخول</button>
      <button data-tab="signup">إنشاء حساب</button>
    </div>
    <button class="google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.19l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.69A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.69V4.98H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.02l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.98l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      المتابعة عبر جوجل
    </button>
    <div class="divider">أو</div>
    <div id="loginPanel">
      <div class="seg" style="margin-bottom:18px;">
        <button class="active" data-login="email">البريد الإلكتروني</button>
        <button data-login="phone">الهاتف</button>
      </div>
      <div class="field" id="loginEmailField">
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="name@example.com" id="loginEmail">
      </div>

// NONE keeps everything working within a single page session; switch to

fbAuth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(err => console.error(err));

const DB = {
  async listAll(collection, whereField, whereValue){
    try {
      let ref = fbDb.collection(collection);
      if (whereField) ref = ref.where(whereField, '==', whereValue);
      const snap = await ref.get();
      return snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      e.collection = collection;
      throw e;
    }
  },
  async get(collection, id){
    try {
      const doc = await fbDb.collection(collection).doc(id).get();
      return doc.exists ? { id: doc.id, ...doc.data() } : null;
    } catch (e) {
      e.collection = collection;
      throw e;
    }
  },
  async create(collection, data, id){
    try {
      if (id) { await fbDb.collection(collection).doc(id).set(data); return { id }; }
      const ref = await fbDb.collection(collection).add(data);
      return { id: ref.id };
    } catch (e) {
      e.collection = collection;
      throw e;
    }
  },
  async update(collection, id, patch){
    try {
      await fbDb.collection(collection).doc(id).set(patch, { merge: true });
      return { id };
    } catch (e) {
      e.collection = collection;
      throw e;
    }
  },
};
function dbFriendlyError(e){
  const code = e && (e.code || '');
  if (code === 'auth/email-already-in-use') return 'هذا البريد مسجّل بحساب بالفعل';
  if (code === 'auth/invalid-email') return 'صيغة البريد الإلكتروني غير صحيحة';
  if (code === 'auth/weak-password') return 'كلمة المرور ضعيفة، استخدم ٨ خانات على الأقل';
  if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'بيانات الدخول غير صحيحة';
  if (code === 'auth/user-not-found') return 'لا يوجد حساب بهذه البيانات';
  if (code === 'auth/popup-closed-by-user') return 'تم إغلاق نافذة تسجيل الدخول عبر جوجل قبل إتمامها';
  if (code === 'auth/popup-blocked') return 'المتصفح منع نافذة جوجل المنبثقة — اسمح بالنوافذ المنبثقة لهذا الموقع';
  if (code === 'auth/unauthorized-domain') return 'هذا الدومين غير مصرّح له بتسجيل الدخول — أضِفه في Firebase Authentication ← Settings ← Authorized domains';
  if (code === 'auth/operation-not-allowed') return 'طريقة الدخول دي غير مفعّلة في مشروع Firebase — فعّلها من Authentication ← Sign-in method';
  if (code === 'auth/configuration-not-found' || code === 'auth/invalid-api-key') return 'إعدادات Firebase غير صحيحة أو خدمة Authentication غير مفعّلة في المشروع أصلًا';
  if (code === 'auth/network-request-failed') return 'تعذّر الوصول للإنترنت أثناء تسجيل الدخول';
  if (code === 'permission-denied') return `لا يوجد صلاحية وصول لمجموعة "${e.collection || ''}" — تحقّق من قواعد الأمان (Firestore Rules)`;
  if (code === 'not-found' || code === 'failed-precondition') return `قاعدة بيانات Firestore غير موجودة لهذا المشروع بعد — أنشئها من Firebase Console ← Firestore Database ← Create database${e.collection ? ' (مجموعة: '+e.collection+')' : ''}`;
  if (code === 'unavailable' || (e && e.message && e.message.includes('Failed to fetch'))) return 'تعذّر الوصول للإنترنت أو لخدمة Firebase، تحقق من الاتصال';
  console.error(e);
  // fallback: show the raw code/message so it can be reported back for diagnosis
  return `خطأ غير متعرَّف عليه: ${code || (e && e.message) || 'غير معروف'}`;
}
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

    return json.data.url;
  }
};

document.getElementById('loginSubmit').addEventListener('click', async () => {
  const btn = document.getElementById('loginSubmit');
  const errEl = document.getElementById('loginErr'); errEl.style.display='none';
  const isEmailMode = document.querySelector('[data-login].active').dataset.login === 'email';
  const identifier = isEmailMode ? document.getElementById('loginEmail').value.trim() : document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPassword').value;
  if (!identifier || !pass){ errEl.textContent='أدخل بيانات الدخول كاملة'; errEl.style.display='block'; return; }
  btn.textContent='...جارٍ الدخول'; btn.disabled=true;
  try {
    let email = identifier;
    if (!isEmailMode) {
      // phone login: resolve the matching account's email first, then sign in
      // with Firebase Auth (which is keyed by email, not phone, in this setup)
      const matches = await DB.listAll('Users', 'phone', identifier);
      if (!matches.length){ errEl.textContent='لا يوجد حساب بهذا الرقم'; errEl.style.display='block'; return; }
      email = matches[0].email;
    }
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    const row = await loadUserDoc(cred.user.uid);

   Console → Authentication → Settings → Authorized domains. It will NOT
   work opened as a local file (file:// or content://) — Firebase rejects
   unregistered origins. Host it on your real domain to test this button. */

fbAuth.onAuthStateChanged(async (user) => {
  // Keeps the in-memory session in sync if Firebase's own auth state
  // changes (e.g. after a popup sign-in resolves asynchronously).
  if (!user) return;
  if (session.user && session.user.uid === user.uid) return;
  try {
    const row = await loadUserDoc(user.uid);
    if (row) { session.user = sessionFromUserRow(user.uid, row); renderNavForUser(); }
  } catch(e){ console.error(e); }
});
function requireCompleteProfile(next){
  if (!session.user){ openAuth('login'); return false; }
  if (!session.user.profileComplete){ document.getElementById('completeOverlay').classList.add('open'); return false; }
  next && next(); return true;
}

const appRoot = document.getElementById('appRoot');
function navigate(path){ location.hash = '#/' + path; }

function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const [name, param] = h.split('/');
  return { name: name || 'home', param };
}
window.addEventListener('hashchange', router);
async function router(){
  const { name, param } = parseHash();
  window.scrollTo(0,0);
  try {
    if (name==='home') await renderHome();
    else if (name==='track') await renderTrack(param);
    else if (name==='course') await renderCourse(param);
    else if (name==='lecture') await renderLecture(param);
    else if (name==='task') await renderTask(param);
    else if (name==='quiz') await renderQuiz(param);
    else if (name==='payment') await renderPayment(param);
    else if (name==='certificate') await renderCertificate(param);
    else if (name==='dashboard') await renderDashboard();
    else appRoot.innerHTML = emptyState('الصفحة غير موجودة', 'تحقق من الرابط أو عد إلى الرئيسية');
  } catch (e) {
    appRoot.innerHTML = emptyState('تعذّر تحميل الصفحة', dbFriendlyError(e));
  }
}

}
function shareRow(path){

async function renderCourse(id){
  appRoot.innerHTML = `<div class="wrap page-head">${crumb([{label:'الرئيسية',href:'#/'},{label:'الدورة'}])}
    <h1 id="courseTitle">...</h1><p id="courseDesc"></p>${shareRow('course/'+id)}
    <div style="margin-top:18px;"><div class="progress-bar" id="courseProgressBar"><div style="width:0%"></div></div></div>
  </div>
  <div class="wrap section"><div class="list" id="lectureList"></div></div>`;
  const [courses, lectures, progress] = await Promise.all([DB.listAll('Courses'), DB.listAll('Lectures'), getUserProgress()]);
  const course = courses.find(c=>String(c.id)===String(id));
  document.getElementById('courseTitle').textContent = course ? course.title_ar : 'دورة غير موجودة';
  document.getElementById('courseDesc').textContent = course ? course.description_ar||'' : '';
  const courseLectures = lectures.filter(l=>String(l.course_id)===String(id)).sort((a,b)=>(a.order||0)-(b.order||0));

  const tasks = await DB.listAll('Tasks');
  const allCourseTasks = tasks.filter(t=>courseLectures.some(l=>String(l.id)===String(t.lecture_id)));
  const doneIds = new Set(progress.filter(p=>String(p.completed).toUpperCase()==='TRUE').map(p=>String(p.task_id)));
  const pct = allCourseTasks.length ? Math.round(100*allCourseTasks.filter(t=>doneIds.has(String(t.id))).length/allCourseTasks.length) : 0;
  document.getElementById('courseProgressBar').innerHTML = `<div style="width:${pct}%"></div>`;

  document.getElementById('lectureList').innerHTML = courseLectures.length ? courseLectures.map((l,i)=>{
    const lTasks = tasks.filter(t=>String(t.lecture_id)===String(l.id));
    const lDone = lTasks.length && lTasks.every(t=>doneIds.has(String(t.id)));
    const locked = i>0 && !(() => {
      const prevTasks = tasks.filter(t=>String(t.lecture_id)===String(courseLectures[i-1].id));
      return prevTasks.length && prevTasks.every(t=>doneIds.has(String(t.id)));
    })();
    return `<div class="list-item ${lDone?'done':''} ${locked?'locked':''}" ${locked?'':`onclick="navigate('lecture/${l.id}')"`}>
      <div class="num">${lDone?icon('check'):(i+1)}</div>
      <div class="info"><h4>${escapeHtml(l.title_ar||'محاضرة')}</h4><span>${lTasks.length} مهمة</span></div>
      <div class="status-icon">${locked?icon('lock'):icon('chevron')}</div>
    </div>`;
  }).join('') : emptyState('لا توجد محاضرات بعد','ستُضاف قريبًا');
}

/* ---------------- QUIZ ---------------- */
let quizState = null;
async function renderQuiz(id){
  appRoot.innerHTML = `<div class="wrap page-head">${crumb([{label:'الرئيسية',href:'#/'},{label:'اختبار'}])}<h1 id="quizTitle">...</h1></div>
  <div class="wrap section" id="quizBody">${emptyState('جارٍ التحميل...','')}</div>`;
  const tasks = await DB.listAll('Tasks');
  const task = tasks.find(t=>String(t.id)===String(id));
  if (!task){ appRoot.innerHTML = emptyState('الاختبار غير موجود',''); return; }
  document.getElementById('quizTitle').textContent = task.title_ar || 'اختبار';

  let quizData;
  try {
    // content_url points to a hosted JSON: { questions:[{q,options:[],correct}], time_limit_minutes, max_attempts, pass_percent }
    const res = await fetch(task.content_url);
    quizData = await res.json();
  } catch(e){
    document.getElementById('quizBody').innerHTML = emptyState('تعذّر تحميل الأسئلة', dbFriendlyError(e));
    return;
  }
  const attempts = session.user ? await DB.listAll('QuizAttempts', 'user_id', session.user.uid) : [];
  const sameTaskAttempts = attempts.filter(a => String(a.task_id) === String(id));
  const maxAttempts = quizData.max_attempts || 3;
  if (sameTaskAttempts.length >= maxAttempts){
    document.getElementById('quizBody').innerHTML = emptyState('انتهت محاولاتك المتاحة', `الحد الأقصى ${maxAttempts} محاولات لهذا الاختبار`);
    return;
  }

  quizState = { taskId:id, questions:quizData.questions||[], answers:{}, passPercent:quizData.pass_percent||75, secondsLeft:(quizData.time_limit_minutes||10)*60, attemptNo:sameTaskAttempts.length+1 };
  document.getElementById('quizBody').innerHTML = `
    <div class="quiz-head"><div>المحاولة ${quizState.attemptNo} من ${maxAttempts}</div><div class="quiz-timer" id="quizTimer">${icon('clock')}<span id="timerText"></span></div></div>
    <div id="quizQuestions">${quizState.questions.map((q,qi)=>`
      <div class="q-card"><h4>${qi+1}. ${escapeHtml(q.q)}</h4>${(q.options||[]).map((opt,oi)=>`
        <label class="q-opt" data-q="${qi}" data-o="${oi}"><input type="radio" name="q${qi}" value="${oi}"><span>${escapeHtml(opt)}</span></label>`).join('')}</div>`).join('')}</div>
    <button class="btn btn-primary btn-block" id="submitQuizBtn">إرسال الإجابات</button>`;

  document.querySelectorAll('.q-opt').forEach(opt=>opt.addEventListener('click', ()=>{
    const qi = opt.dataset.q;
    document.querySelectorAll(`.q-opt[data-q="${qi}"]`).forEach(o=>o.classList.remove('selected'));
    opt.classList.add('selected'); opt.querySelector('input').checked = true;
    quizState.answers[qi] = Number(opt.dataset.o);
  }));
  document.getElementById('submitQuizBtn').addEventListener('click', submitQuiz);
  startQuizTimer();
}
function startQuizTimer(){
  const timerEl = document.getElementById('timerText');
  const wrap = document.getElementById('quizTimer');
  const tick = () => {
    if (!quizState) return;
    const m = Math.floor(quizState.secondsLeft/60), s = quizState.secondsLeft%60;
    timerEl.textContent = `${m}:${String(s).padStart(2,'0')}`;
    if (quizState.secondsLeft <= 30) wrap.classList.add('warn');
    if (quizState.secondsLeft <= 0){ clearInterval(quizState._timer); submitQuiz(); return; }
    quizState.secondsLeft--;
  };
  tick();
  quizState._timer = setInterval(tick, 1000);
}
async function submitQuiz(){
  if (!quizState) return;
  clearInterval(quizState._timer);
  const total = quizState.questions.length || 1;
  let correct = 0;
  quizState.questions.forEach((q,qi) => { if (quizState.answers[qi] === q.correct) correct++; });
  const score = Math.round(100*correct/total);
  const passed = score >= quizState.passPercent;
  try {
    if (session.user){
      await DB.create('QuizAttempts', { user_id:session.user.uid, user_email:session.user.email, task_id:quizState.taskId, score, passed:passed?'TRUE':'FALSE', attempt_no:quizState.attemptNo, created_at:new Date().toISOString() });
      if (passed) await markTaskComplete(quizState.taskId);
    }
  } catch(e){ console.error(e); }
  document.getElementById('quizBody').innerHTML = `
    <div class="quiz-result ${passed?'':'fail'}">
      ${icon(passed?'badge':'quiz')}
      <div class="score">${score}%</div>
      <p style="color:var(--ink-soft); margin-top:10px;">${passed ? 'أحسنت! لقد اجتزت الاختبار' : `تحتاج ${quizState.passPercent}% على الأقل للنجاح`}</p>
      <div style="margin-top:24px; display:flex; gap:10px; justify-content:center;">
        ${passed ? `<button class="btn btn-primary" onclick="history.back()">متابعة</button>` : `<button class="btn btn-ghost" onclick="renderQuiz('${quizState.taskId}')">إعادة المحاولة</button>`}
      </div>
    </div>`;
  quizState = null;
}

/* ---------------- PAYMENT ---------------- */
async function renderPayment(){
  if (!requireCompleteProfile()) return;
  appRoot.innerHTML = `<div class="wrap page-head">${crumb([{label:'الرئيسية',href:'#/'},{label:'الدفع والاشتراك'}])}<h1>${icon('wallet')} محفظتي واشتراكاتي</h1>
    <p>اختر خطة الاشتراك ثم طريقة الدفع المناسبة لك.</p></div>
  <div class="wrap section">
    <div class="plan-grid">
      <div class="plan-card"><h3>مسار واحد</h3><div class="price">حسب الدورة</div><p style="font-size:13px; color:var(--ink-soft)">وصول كامل لدورة واحدة</p></div>
      <div class="plan-card featured"><h3>اشتراك شهري</h3><div class="price">اشترك الآن</div><p style="font-size:13px; color:var(--ink-soft)">وصول لكل المسارات والدورات</p></div>
      <div class="plan-card"><h3>كود خصم</h3><div class="price">%</div><p style="font-size:13px; color:var(--ink-soft)">أدخل كوبونك عند الدفع</p></div>
    </div>
    <div class="field" style="max-width:320px; margin:8px 0 28px;"><label>كود خصم (إن وجد)</label><input type="text" id="couponInput" placeholder="مثال: RAQEEM10"></div>

    <div class="pay-grid">
      <div class="pay-opt active" data-method="paypal">${icon('paypal')}<h4>PayPal</h4></div>
      <div class="pay-opt" data-method="vodafone">${icon('phoneCash')}<h4>فودافون كاش</h4></div>
      <div class="pay-opt" data-method="instapay">${icon('transfer')}<h4>إنستاباي</h4></div>
    </div>
    <div id="payDetail"></div>
  </div>`;

  document.querySelectorAll('.pay-opt').forEach(el=>el.addEventListener('click', ()=>{
    document.querySelectorAll('.pay-opt').forEach(x=>x.classList.remove('active'));
    el.classList.add('active');
    renderPayDetail(el.dataset.method);
  }));
  renderPayDetail('paypal');
}
function renderPayDetail(method){
  const box = document.getElementById('payDetail');
  if (method==='paypal'){
    box.innerHTML = `<div class="pay-detail">
      <p style="color:var(--ink-soft); font-size:13.5px;">ادفع مباشرة وبأمان عبر باي بال.</p>
      <div id="paypal-button-container" style="margin-top:16px;"></div>
      <p style="font-size:11.5px; color:var(--ink-soft); margin-top:10px;">Client ID: ${CONFIG.PAYPAL_CLIENT_ID.slice(0,14)}…</p>
    </div>`;
    // Real integration: inject the PayPal SDK script tag once, pointing its
    // src to https://www.paypal.com/sdk/js with client-id + currency query
    // params, then call paypal.Buttons({ createOrder, onApprove }).render(...)
    if (!window.paypal && !document.getElementById('paypalSdk')){
      const s = document.createElement('script');
      s.id = 'paypalSdk'; s.src = `https://www.paypal.com/sdk/js?client-id=${CONFIG.PAYPAL_CLIENT_ID}&currency=USD`;
      s.onload = () => window.paypal?.Buttons({
        createOrder:(data,actions)=>actions.order.create({purchase_units:[{amount:{value:'10.00'}}]}),
        onApprove: async (data,actions)=>{ await actions.order.capture(); toast('تم الدفع بنجاح عبر PayPal'); }
      }).render('#paypal-button-container');
      document.body.appendChild(s);
    } else if (window.paypal) {
      window.paypal.Buttons({ createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:'10.00'}}]}), onApprove: async (d,a)=>{ await a.order.capture(); toast('تم الدفع بنجاح عبر PayPal'); } }).render('#paypal-button-container');
    }
  } else if (method==='vodafone'){
    box.innerHTML = `<div class="pay-detail">
      <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:14px;">حوّل المبلغ إلى الرقم التالي عبر فودافون كاش، ثم ارفع صورة إثبات التحويل.</p>
      <div class="copy-row"><span>${CONFIG.VODAFONE_CASH_NUMBER}</span><button class="btn btn-ghost btn-sm" onclick="copyText('${CONFIG.VODAFONE_CASH_NUMBER}')">${icon('copy')} نسخ</button></div>
      ${proofUploadBlock('vodafone')}
    </div>`;
    bindProofUpload('vodafone');
  } else {
    box.innerHTML = `<div class="pay-detail">
      <p style="color:var(--ink-soft); font-size:13.5px; margin-bottom:14px;">اختر أحد روابط إنستاباي التالية لإرسال المبلغ، ثم ارفع صورة إثبات التحويل.</p>
      ${CONFIG.INSTAPAY_LINKS.map((l,i)=>`
        <div class="copy-row" style="margin-bottom:10px;">
          <span style="direction:ltr;">${l.handle}</span>
          <a class="btn btn-primary btn-sm" href="${l.url}" target="_blank" rel="noopener">${icon('link')} فتح الرابط ${i+1}</a>
        </div>`).join('')}
      ${proofUploadBlock('instapay')}
    </div>`;
    bindProofUpload('instapay');
  }
}
function proofUploadBlock(method){
  return `<div class="field" style="margin-top:18px;"><label>صورة إثبات التحويل *</label><input type="file" accept="image/*" id="proof-${method}"></div>
    <button class="btn btn-primary btn-block" id="submitProof-${method}">${icon('upload')} إرسال للمراجعة</button>
    <p style="font-size:12px; color:var(--ink-soft); margin-top:10px;">ستراجع الإدارة الإيصال وتُفعّل اشتراكك خلال وقت قصير.</p>`;
}
function bindProofUpload(method){
  document.getElementById(`submitProof-${method}`).addEventListener('click', async () => {
    const input = document.getElementById(`proof-${method}`);
    const file = input.files[0];
    if (!file){ toast('الرجاء اختيار صورة التحويل أولًا'); return; }
    const btn = document.getElementById(`submitProof-${method}`);
    btn.textContent = '...جارٍ الرفع'; btn.disabled = true;
    try {
      const proofUrl = await ImgBB.upload(file);
      await DB.create('Payments', { user_id:session.user.uid, user_email:session.user.email, method, amount:'', proof_url:proofUrl, status:'pending', created_at:new Date().toISOString(), note:document.getElementById('couponInput')?.value||'' });
      toast('تم إرسال طلب الدفع، بانتظار مراجعة الإدارة');
    } catch(e){ toast(dbFriendlyError(e)); }
    finally { btn.innerHTML = `${icon('upload')} إرسال للمراجعة`; btn.disabled = false; }
  });
}

/* ---------------- CERTIFICATE VERIFICATION ---------------- */
async function renderCertificate(code){
  appRoot.innerHTML = `<div class="wrap section">${emptyState('جارٍ التحقق...','')}</div>`;
  try {
    const certs = await DB.listAll('Certificates');
    const cert = certs.find(c=>c.verify_code===code);
    if (!cert || cert.status!=='issued'){
      appRoot.innerHTML = `<div class="wrap section" style="max-width:520px; margin:0 auto;">
        <div class="cert-box" style="border-color:var(--danger);">
          <div class="valid-badge" style="background:#B23A3414; color:var(--danger);">${icon('badge')} غير صالحة</div>
          <h2>لم يتم العثور على هذه الشهادة</h2>
          <p style="color:var(--ink-soft); font-size:13.5px;">تحقق من رابط الشهادة أو تواصل مع الإدارة.</p>
        </div></div>`;
      return;
    }
    const verifyUrl = `${location.origin}${location.pathname}#/certificate/${code}`;
    appRoot.innerHTML = `<div class="wrap section" style="max-width:520px; margin:0 auto;">
      <div class="cert-box">
        <div class="valid-badge">${icon('check')} شهادة موثّقة</div>
        <h2>${escapeHtml(cert.full_name_ar||'')}</h2>
        <p style="color:var(--ink-soft);">أتمّ بنجاح دورة رقم ${escapeHtml(cert.course_id||'')} بتاريخ ${escapeHtml((cert.issued_at||'').slice(0,10))}</p>
        <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(verifyUrl)}" alt="QR">
        <p style="font-size:11.5px; color:var(--ink-soft); margin-top:14px;">رمز التحقق: ${escapeHtml(code)}</p>
      </div>
    </div>`;
  } catch(e){ appRoot.innerHTML = emptyState('تعذّر التحقق من الشهادة', dbFriendlyError(e)); }
}

/* ---------------- DASHBOARD ---------------- */
async function renderDashboard(){
  if (!session.user){ openAuth('login'); appRoot.innerHTML = emptyState('سجّل الدخول أولًا','للوصول إلى لوحتك الشخصية'); return; }
  appRoot.innerHTML = `<div class="wrap page-head"><h1>${icon('user')} لوحتي</h1></div>
  <div class="wrap section dash-grid">
    <nav class="dash-nav">
      <button class="active" data-dtab="progress">${icon('book')} تقدّمي</button>
      <button data-dtab="certs">${icon('badge')} شهاداتي</button>
      <button data-dtab="payments">${icon('wallet')} مدفوعاتي</button>
      <button data-dtab="profile">${icon('user')} الملف الشخصي</button>
      <button data-dtab="pay" onclick="navigate('payment')" style="color:var(--emerald);">${icon('wallet')} الدفع والاشتراك</button>
    </nav>
    <div id="dashPanel">${emptyState('جارٍ التحميل...','')}</div>
  </div>`;
  document.querySelectorAll('[data-dtab]').forEach(b=>{
    if (!b.hasAttribute('onclick')) b.addEventListener('click', ()=>{
      document.querySelectorAll('[data-dtab]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); loadDashPanel(b.dataset.dtab);
    });
  });
  loadDashPanel('progress');
}
async function loadDashPanel(tab){
  const panel = document.getElementById('dashPanel');
  if (tab==='progress'){
    const [courses, lectures, tasks, progress] = await Promise.all([DB.listAll('Courses'), DB.listAll('Lectures'), DB.listAll('Tasks'), getUserProgress()]);
    const doneIds = new Set(progress.filter(p=>String(p.completed).toUpperCase()==='TRUE').map(p=>String(p.task_id)));
    panel.innerHTML = courses.length ? courses.map(c=>{
      const cLectures = lectures.filter(l=>String(l.course_id)===String(c.id));
      const cTasks = tasks.filter(t=>cLectures.some(l=>String(l.id)===String(t.lecture_id)));
      const pct = cTasks.length ? Math.round(100*cTasks.filter(t=>doneIds.has(String(t.id))).length/cTasks.length) : 0;
      return `<div class="list-item" onclick="navigate('course/${c.id}')">
        <div class="info"><h4>${escapeHtml(c.title_ar||'')}</h4><div class="progress-bar"><div style="width:${pct}%"></div></div></div>
        <div class="status-icon">${pct}%</div></div>`;
    }).join('') : emptyState('لا توجد دورات بعد','تصفّح الدورات وابدأ التعلّم');
  } else if (tab==='certs'){
    const certs = session.user ? await DB.listAll('Certificates', 'user_id', session.user.uid) : [];
    panel.innerHTML = certs.length ? certs.map(c=>`
      <div class="list-item" onclick="navigate('certificate/${c.verify_code}')">
        <div class="num">${icon('badge')}</div>
        <div class="info"><h4>دورة ${escapeHtml(c.course_id||'')}</h4><span>${c.status==='issued'?'صادرة':'قيد المراجعة'}</span></div>
        <div class="status-icon">${icon('chevron')}</div></div>`).join('') : emptyState('لا توجد شهادات بعد','أكمل دورة بنسبة 75% فأكثر لطلب شهادتك');
  } else if (tab==='payments'){
    const pays = session.user ? await DB.listAll('Payments', 'user_id', session.user.uid) : [];
    panel.innerHTML = pays.length ? pays.map(p=>`
      <div class="list-item"><div class="num">${icon('wallet')}</div>
        <div class="info"><h4>${escapeHtml(p.method||'')}</h4><span>${escapeHtml((p.created_at||'').slice(0,10))}</span></div>
        <div class="status-icon">${p.status==='approved'?icon('check'):p.status==='rejected'?'مرفوض':'قيد المراجعة'}</div></div>`).join('') : emptyState('لا توجد مدفوعات بعد','');
  } else if (tab==='profile'){
    panel.innerHTML = `
      <div class="field"><label>الاسم</label><input type="text" id="dpName" value="${escapeHtml(session.user.name||'')}"></div>
      <div class="field"><label>البريد الإلكتروني</label><input type="email" value="${escapeHtml(session.user.email||'')}" disabled></div>
      <div class="field"><label>رقم الهاتف / الواتساب</label><input type="tel" id="dpPhone" value="${escapeHtml(session.user.phone||'')}"></div>
      <button class="btn btn-primary" id="saveProfileBtn">حفظ التغييرات</button>
      <button class="btn btn-ghost" id="logoutBtn" style="margin-top:10px;">تسجيل الخروج</button>`;
    document.getElementById('saveProfileBtn').addEventListener('click', async ()=>{
      const btn = document.getElementById('saveProfileBtn');
      const patch = {
        full_name: document.getElementById('dpName').value.trim() || session.user.name,
        phone: document.getElementById('dpPhone').value.trim(),
      };
      btn.textContent = '...جارٍ الحفظ'; btn.disabled = true;
      try {
        if (session.user?.uid) await DB.update('Users', session.user.uid, patch);
        session.user.name = patch.full_name; session.user.phone = patch.phone;
        renderNavForUser(); toast('تم حفظ التغييرات');
      } catch(e){ toast(dbFriendlyError(e)); }
      finally { btn.textContent = 'حفظ التغييرات'; btn.disabled = false; }
    });
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      try { await fbAuth.signOut(); } catch(e){ console.error(e); }
      session.user = null; renderNavForUser(); toast('تم تسجيل الخروج'); navigate('');
    });
  }
}
