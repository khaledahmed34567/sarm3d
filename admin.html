<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سَرْمَد — لوحة التحكم</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="https://i.ibb.co/CyBhgJ0/icon.png">
<meta name="theme-color" content="#F6F6F8">
<link rel="stylesheet" href="./styles.css">
<style>
  .admin-wrap{ max-width:640px; margin:0 auto; padding: 20px 16px 60px; }
  .admin-tabs{ display:flex; gap:8px; overflow-x:auto; margin-bottom:18px; }
  .admin-tabs button{ white-space:nowrap; border:none; background:rgba(20,20,30,0.06); padding:9px 16px; border-radius:99px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .admin-tabs button.active{ background:var(--red); color:#fff; }
  .admin-panel{ display:none; }
  .admin-panel.active{ display:block; }
  .list-item{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-radius:16px; margin-bottom:8px; }
  .list-item .name{ font-weight:700; font-size:14px; }
  .list-item .sub{ font-size:12px; color:var(--ink-soft); }
  .danger-btn{ background:none; border:none; color:var(--red); cursor:pointer; font-size:12.5px; font-weight:700; }
  .form-card{ padding:18px; margin-bottom:20px; }
  .qbox{ border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
</style>
</head>
<body class="protected">
<div id="toast-host"></div>

<section id="admin-lock" class="screen active" style="padding-top:60px;">
  <div class="auth-hero">
    <img class="logo-mark allow-context" src="https://i.ibb.co/PZsJ4ptx/logo.png" alt="">
    <h1>لوحة التحكم</h1>
    <p>هذه الصفحة مخصصة لفريق الإدارة فقط</p>
  </div>
  <div class="glass" style="padding:22px; max-width:420px; margin:0 auto;">
    <p id="admin-lock-msg">جاري التحقق من الصلاحيات...</p>
  </div>
</section>

<div class="admin-wrap" id="admin-root" style="display:none;">
  <div class="topbar" style="border-radius:20px; margin-bottom:16px;">
    <img class="logo allow-context" src="https://i.ibb.co/PZsJ4ptx/logo.png">
    <a href="./index.html" class="icon-btn" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21V9h6v12M3 10l9-7 9 7"/></svg>
    </a>
  </div>

  <div class="admin-tabs">
    <button class="active" data-panel="p-tracks">المسارات</button>
    <button data-panel="p-courses">الكورسات</button>
    <button data-panel="p-lectures">المحاضرات</button>
    <button data-panel="p-tasks">المهام</button>
    <button data-panel="p-forum">المنتدى</button>
  </div>

  <!-- المسارات -->
  <div class="admin-panel active" id="p-tracks">
    <form class="glass form-card" id="form-track">
      <h3>إضافة مسار</h3>
      <div class="field"><label>العنوان</label><input type="text" id="tr-title" required></div>
      <div class="field"><label>الوصف</label><textarea id="tr-desc" rows="2"></textarea></div>
      <div class="field"><label>رابط الصورة</label><input type="url" id="tr-image"></div>
      <div class="field"><label>الترتيب</label><input type="number" id="tr-order" value="1"></div>
      <button class="btn btn-primary btn-block" type="submit">إضافة</button>
    </form>
    <div id="list-tracks"></div>
  </div>

  <!-- الكورسات -->
  <div class="admin-panel" id="p-courses">
    <form class="glass form-card" id="form-course">
      <h3>إضافة كورس</h3>
      <div class="field"><label>المسار</label><select id="co-track" required></select></div>
      <div class="field"><label>العنوان</label><input type="text" id="co-title" required></div>
      <div class="field"><label>الوصف</label><textarea id="co-desc" rows="2"></textarea></div>
      <div class="field"><label>رابط الصورة</label><input type="url" id="co-image"></div>
      <div class="field"><label>المحاضر</label><input type="text" id="co-instructor"></div>
      <div class="field"><label>تاريخ البداية</label><input type="text" id="co-start" placeholder="مثال: 1 أكتوبر 2026"></div>
      <div class="field">
        <label><input type="checkbox" id="co-paid" style="width:auto; display:inline-block;"> كورس مدفوع</label>
      </div>
      <div class="field"><label>السعر ($)</label><input type="number" id="co-price" value="0"></div>
      <button class="btn btn-primary btn-block" type="submit">إضافة</button>
    </form>
    <div id="list-courses"></div>
  </div>

  <!-- المحاضرات -->
  <div class="admin-panel" id="p-lectures">
    <form class="glass form-card" id="form-lecture">
      <h3>إضافة محاضرة</h3>
      <div class="field"><label>الكورس</label><select id="le-course" required></select></div>
      <div class="field"><label>العنوان</label><input type="text" id="le-title" required></div>
      <div class="field"><label>الوصف</label><textarea id="le-desc" rows="2"></textarea></div>
      <div class="field"><label>رابط الصورة</label><input type="url" id="le-image"></div>
      <div class="field"><label>المدة (دقيقة)</label><input type="number" id="le-duration" value="10"></div>
      <div class="field"><label>الترتيب</label><input type="number" id="le-order" value="1"></div>
      <button class="btn btn-primary btn-block" type="submit">إضافة</button>
    </form>
    <div id="list-lectures"></div>
  </div>

  <!-- المهام -->
  <div class="admin-panel" id="p-tasks">
    <form class="glass form-card" id="form-task">
      <h3>إضافة مهمة</h3>
      <div class="field"><label>المحاضرة</label><select id="ta-lecture" required></select></div>
      <div class="field">
        <label>نوع المهمة</label>
        <select id="ta-type">
          <option value="json">محتوى تفاعلي (JSON)</option>
          <option value="pdf">ملف PDF</option>
          <option value="video">فيديو</option>
          <option value="mcq">اختبار MCQ</option>
          <option value="code">مهمة برمجية</option>
        </select>
      </div>
      <div class="field"><label>الترتيب</label><input type="number" id="ta-order" value="1"></div>
      <div class="field"><label>مدة الاختبار/المهمة (ثانية، اختياري)</label><input type="number" id="ta-time" placeholder="0 = بدون حد"></div>

      <div id="ta-fields-json" class="task-type-fields">
        <div class="field"><label>عنوان المحتوى</label><input type="text" id="tj-title"></div>
        <div class="field"><label>اللون (HEX)</label><input type="text" id="tj-color" value="#E23B3B"></div>
        <div class="field"><label>نص المحتوى</label><textarea id="tj-text" rows="3"></textarea></div>
        <div class="field"><label>رابط صورة (اختياري)</label><input type="url" id="tj-image"></div>
        <div class="field"><label>رابط خارجي (اختياري)</label><input type="url" id="tj-link"></div>
      </div>
      <div id="ta-fields-pdf" class="task-type-fields" style="display:none;">
        <div class="field"><label>رابط PDF (ينتهي بـ .pdf)</label><input type="url" id="tp-url" placeholder="https://files.catbox.moe/xxx.pdf"></div>
      </div>
      <div id="ta-fields-video" class="task-type-fields" style="display:none;">
        <div class="field"><label>رابط الفيديو (mp4 أو يوتيوب)</label><input type="url" id="tv-url"></div>
        <div class="field"><label>المدة التقديرية بالثانية (لفيديوهات يوتيوب)</label><input type="number" id="tv-est" value="120"></div>
      </div>
      <div id="ta-fields-mcq" class="task-type-fields" style="display:none;">
        <div id="mcq-builder"></div>
        <button type="button" class="btn btn-secondary" id="btn-add-q">+ إضافة سؤال</button>
      </div>
      <div id="ta-fields-code" class="task-type-fields" style="display:none;">
        <div class="field"><label>اللغة</label>
          <select id="tc-lang"><option value="javascript">JavaScript</option><option value="python">Python</option></select>
        </div>
        <div class="field"><label>التعليمات</label><textarea id="tc-instructions" rows="2"></textarea></div>
        <div class="field"><label>الكود المبدئي</label><textarea id="tc-starter" rows="3" style="direction:ltr; font-family:monospace;"></textarea></div>
      </div>

      <button class="btn btn-primary btn-block" type="submit" style="margin-top:8px;">إضافة المهمة</button>
    </form>
    <div id="list-tasks"></div>
  </div>

  <!-- المنتدى -->
  <div class="admin-panel" id="p-forum">
    <h3 style="margin-bottom:10px;">مشاركات المنتدى</h3>
    <div id="list-forum"></div>
  </div>
</div>

<script type="module" src="./admin.js"></script>
</body>
</html>
